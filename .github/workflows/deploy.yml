# Builds the site and publishes it to GitHub Pages on every push to main.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the version check compares with the previous push
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # A website change needs a new version number (ARCHITECTURE.md 3.9).
      - run: node scripts/check-version.mjs
        env:
          BEFORE: ${{ github.event.before }}
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          # Public values, stored as repository variables (not secrets).
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
          VITE_EMAIL_LOGIN: ${{ vars.VITE_EMAIL_LOGIN }}
      # Fails when the login page grows past its limit (ARCHITECTURE.md 1.11 D9).
      - run: npm run size
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
